l="none" stroke="#f2b63c" stroke-width="1.7222222222222223"/><rect x="235" y="143" width="62" height="31" rx="3" fill="#f2b63c"/></g><g ><rect x="422" y="112" width="62" height="62" rx="3" fill="#ff6b57"/><path d="M435.64 165.32 L454.24 143.62 L449.9 139.28 L470.98 120.68" stroke="#16181b" stroke-width="2.82" fill="none" stroke-linejoin="round"/></g><path  d="M609 112 H646.2 V136.8 H671 V174 H609 Z" fill="#a99bff"/><rect  x="796" y="112" width="62" height="62" rx="3" fill="#4cc3a0"/><rect  x="983" y="112" width="62" height="62" rx="3" fill="#94979d" opacity="0.3"/><g ><rect x="1170.5" y="112.5" width="61" height="61" rx="3" fill="none" stroke="#3a3e45"/><circle cx="1201" cy="143" r="5.58" fill="#94979d"/></g></g>
