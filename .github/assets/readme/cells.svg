.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes w0{0%,47%{opacity:1}47.01%,100%{opacity:0}}@keyframes w1{0%,46.99%{opacity:0}47%,100%{opacity:1}}.on{animation:w0 9s linear infinite}.off{animation:w1 9s linear infinite}
</style>
<defs><filter id="grey" x="0" y="0" width="1" height="1"><feColorMatrix type="saturate" values="1"><animate attributeName="values" values="1;1;0;0;1" keyTimes="0;0.44;0.5;0.94;1" dur="9s" repeatCount="indefinite"/></feColorMatrix></filter></defs>
<rect x="0.5" y="0.5" width="1279" height="249" rx="14" fill="#1a1c20" stroke="#2e3137"/><path d="M18 28 L18 18" stroke="#3a3e45" stroke-width="1"/><path d="M18 18 L28 18" stroke="#3a3e45" stroke-width="1"/><path d="M1252 18 L1262 18" stroke="#3a3e45" stroke-width="1"/><path d="M1262 18 L1262 28" stroke="#3a3e45" stroke-width="1"/><path d="M18 222 L18 232" stroke="#3a3e45" stroke-width="1"/><path d="M18 232 L28 232" stroke="#3a3e45" stroke-width="1"/><path d="M1252 232 L1262 232" stroke="#3a3e45" stroke-width="1"/><path d="M1262 232 L1262 222" stroke="#3a3e45" stroke-width="1"/><text class="m" x="48" y="56" font-size="12" fill="#f2b63c" letter-spacing="2" text-anchor="start">CELL GRAMMAR</text><text x="48" y="86" font-size="20" font-weight="700" fill="#eceae4">Shape encodes phase, so the grid still reads with the colour switched off.</text><g class="m" font-size="12.5"><rect x="1080" y="40" width="152" height="28" rx="14" fill="#212328" stroke="#2e3137"/>
