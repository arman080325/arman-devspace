<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-label="Cell grammar: exploring dashed, building half-filled, breaking cracked, rebuilding notched, shipped solid, archived faded, no data dot">
<title>Cell grammar: exploring dashed, building half-filled, breaking cracked, rebuilding notched, shipped solid, archived faded, no data dot</title>
<style>
