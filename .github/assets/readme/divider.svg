<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="img" aria-label="section divider">
<defs>
  <linearGradient id="base" x1="0" x2="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/><stop offset=".5" stop-color="#263244"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
</defs>
<style>
.sh{animation:sh 4.5s cubic-bezier(.45,0,.55,1) infinite}
@keyframes sh{from{transform:translateX(-260px)}to{transform:translateX(1200px)}}
.gem{transform-origin:600px 14px;animation:gem 4.5s ease-in-out infinite}
@keyframes gem{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(225deg) scale(1.25)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="0" y="13" width="1200" height="2" fill="url(#base)"/>
<rect class="sh" x="0" y="13" width="260" height="2" fill="url(#shine)"/>
<rect class="gem" x="594" y="8" width="12" height="12" rx="2" fill="#0B0D12" stroke="#8B5CF6" stroke-width="2"/>
</svg>
