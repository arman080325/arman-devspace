<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Seven modernization phases: Discover and Clone, Architecture Analysis, Modernization Plan, Core Implementation, Automated Testing, Documentation and Polish, Deployment and Review">
<title>The seven-phase modernization roadmap</title>
<defs><linearGradient id="prog" x1="0" x2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#22C55E"/></linearGradient></defs>
<style>
.fill{stroke-dasharray:1000.0;stroke-dashoffset:1000.0;animation:fill 9s cubic-bezier(.4,0,.2,1) infinite}
@keyframes fill{0%{stroke-dashoffset:1000.0}70%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.on,.core{opacity:0;animation:on 9s ease-out infinite}
@keyframes on{0%{opacity:0}3%,90%{opacity:1}100%{opacity:0}}
.ripple{opacity:0;animation:ripple 9s ease-out infinite}
@keyframes ripple{0%{opacity:.9;transform:scale(1)}12%{opacity:0;transform:scale(2.6)}100%{opacity:0}}
.lbl{opacity:.35;animation:lbl 9s ease-out infinite}
@keyframes lbl{0%{opacity:.35}4%,90%{opacity:1}100%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="1198" height="298" rx="22" fill="#0B0D12" stroke="#263244" stroke-width="2"/>
<text x="40" y="40" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#94A3B8">$ git log --graph --oneline <tspan fill="#8B5CF6">roadmap</tspan></text>
<text x="1160" y="40" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#475569">each of the 100 workspaces walks this path</text>
<path d="M100 150H1100" stroke="#263244" stroke-width="4" stroke-linecap="round"/>
