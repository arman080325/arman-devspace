services:
  postgres:
    image: postgres:16-alpine
    container_name: arman-devspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arman_devspace
    ports:
      - "5432:5432"
    volumes:
      - arman_devspace_pgdata:/var/lib/postgresql/data

volumes:
  arman_devspace_pgdata:

